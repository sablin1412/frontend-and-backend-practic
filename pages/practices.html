<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практики - Портфолио</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/theme.css">
</head>
<body class="bg-light">
    <div class="container-fluid p-0">
        <header class="header bg-primary text-white py-4">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col">
                        <h1 class="header__title h3 mb-1">Портфолио Студента</h1>
                    </div>
                </div>
            </div>
        </header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html"><i class="bi bi-house me-1"></i>Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="news.html"><i class="bi bi-newspaper me-1"></i>Новости</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="practices.html"><i class="bi bi-code-slash me-1"></i>Практики</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="goods.html"><i class="bi bi-cart me-1"></i>Товары</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacts.html"><i class="bi bi-telephone me-1"></i>Контакты</a>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <button class="theme-toggle" id="themeToggle">
                            <span class="theme-toggle__slider">
                                <i class="bi bi-sun-fill theme-toggle__icon"></i>
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        window.addEventListener('DOMContentLoaded', function() {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.querySelector('.theme-toggle__icon');
            
            function updateIcon(theme) {
                if (themeIcon) {
                    themeIcon.className = theme === 'dark' ? 'bi bi-moon-fill theme-toggle__icon' : 'bi bi-sun-fill theme-toggle__icon';
                }
            }
            
            updateIcon(localStorage.getItem('theme') || 'light');
            
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    const current = document.documentElement.getAttribute('data-theme');
                    const newTheme = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    updateIcon(newTheme);
                });
            }
        });
    </script>
</body>
</html>
